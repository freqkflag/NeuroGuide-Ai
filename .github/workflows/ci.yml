name: CI
on: [push, pull_request]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install deps
        run: |
          cd backend
          poetry install
      - name: Lint (ruff)
        run: cd backend && poetry run ruff check .
      - name: Formatting (black)
        run: cd backend && poetry run black --check .
      - name: Tests
        run: cd backend && poetry run pytest -q
