name: CI
on:
  push:
    branches: [main, agents-sdk-integration]
  pull_request:
    branches: [main]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b4ffde65f46336abfa8818816574704664686401 # v4.1.1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install deps
        run: |
          cd backend
          poetry install
      - name: Lint (ruff)
        run: cd backend && poetry run ruff check .
      - name: Formatting (black)
        run: cd backend && poetry run black --check .
      - name: Tests
        run: cd backend && poetry run pytest -q
